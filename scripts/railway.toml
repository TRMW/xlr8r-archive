# One-shot content pipeline.
#
# NOTE: this service auto-deploys on every push to main like any other,
# so whatever start command is set here re-runs on each commit. Keep it
# idempotent. extract_articles.py needs --replace for exactly this
# reason: without it, each run appends another copy of every article
# (a re-run took the article count from 304 to 817 before this was
# fixed). The fetch scripts already upsert on conflict, so they're safe.
#
# Set startCommand to audit_check.py when you just want diagnostics.
[deploy]
startCommand = "python fetch_archive_metadata.py --dsn $DATABASE_URL && python fetch_wayback_links.py --dsn $DATABASE_URL && python fetch_hyperreal_links.py --dsn $DATABASE_URL && python extract_articles.py --replace --dsn $DATABASE_URL && python audit_check.py"
restartPolicyType = "NEVER"
