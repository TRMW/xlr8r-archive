[deploy]
startCommand = "python fetch_archive_metadata.py --dsn $DATABASE_URL && python -c \"import os,psycopg2; c=psycopg2.connect(os.environ['DATABASE_URL']); c.autocommit=True; cur=c.cursor(); cur.execute(\\\"DELETE FROM issues WHERE identifier = 'XLR8R101'\\\"); print('cleaned up stale bundle-as-one-issue row:', cur.rowcount)\" && python fetch_wayback_links.py --dsn $DATABASE_URL && python fetch_hyperreal_links.py --dsn $DATABASE_URL && python extract_articles.py --dsn $DATABASE_URL && python -c \"import os,psycopg2; c=psycopg2.connect(os.environ['DATABASE_URL']); cur=c.cursor(); cur.execute('SELECT count(*) FROM issues'); i=cur.fetchone()[0]; cur.execute('SELECT count(*) FROM articles'); a=cur.fetchone()[0]; cur.execute('SELECT count(*) FROM content_links'); l=cur.fetchone()[0]; print(f'FINAL_COUNTS issues={i} articles={a} content_links={l}')\" && echo PIPELINE_COMPLETE"
restartPolicyType = "NEVER"
